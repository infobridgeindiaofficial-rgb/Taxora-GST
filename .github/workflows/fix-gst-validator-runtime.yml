name: Fix GST Validator Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gst-validator-runtime.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair validator runtime and duplicate markup
        run: python tools/fix_gst_validator_runtime.py
      - name: Run validator logic tests
        run: node tools/test_gst_validators.mjs
      - name: Verify browser-safe wiring
        shell: python
        run: |
          from pathlib import Path
          s = Path('TAXORA GST.dc.html').read_text(encoding='utf-8')
          assert s.count('<script src="./gst-validators-browser.js"></script>') == 1
          assert '<script type="module" src="./gst-validators.js"></script>' not in s
          assert s.count('id="taxora-gstin-modal"') == 1
          assert s.count('id="taxora-invoice-modal"') == 1
          assert s.count('onclick="window.TaxoraValidatorUI && window.TaxoraValidatorUI.openGSTIN()"') >= 1
          assert s.count('onclick="window.TaxoraValidatorUI && window.TaxoraValidatorUI.openInvoices()"') >= 1
          print('Browser wiring checks passed')
      - name: Commit repaired files
        run: |
          git config user.name "Taxora Workspace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'TAXORA GST.dc.html' 'gst-validators-browser.js'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix GST validator cards runtime [skip ci]'
          git push origin main
