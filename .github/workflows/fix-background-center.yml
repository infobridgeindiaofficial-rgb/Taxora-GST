name: Fix Ambient Background Center

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-background-center.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Center ambient background
        shell: python
        run: |
          from pathlib import Path
          p = Path('TAXORA GST.dc.html')
          s = p.read_text(encoding='utf-8')
          old = "background-position:-25% center"
          new = "background-position:center center"
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly 1 old background position, found {n}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s = Path('TAXORA GST.dc.html').read_text(encoding='utf-8')
          if "background-position:center center" not in s:
              raise SystemExit('Centered background position missing')
          if "background-position:-25% center" in s:
              raise SystemExit('Old left-shifted background position still present')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          git commit -m "Center ambient India background [skip ci]"
          git push origin main
