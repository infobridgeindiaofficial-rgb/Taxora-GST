name: Apply GST Validator Cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gst-validator-cards.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply cards and modals
        run: python tools/apply_gst_validator_cards.py
      - name: Verify feature anchors
        run: |
          grep -q 'gst-validators.js' 'TAXORA GST.dc.html'
          grep -q 'GSTIN Validator</h3>' 'TAXORA GST.dc.html'
          grep -q 'Invoice Number Checker</h3>' 'TAXORA GST.dc.html'
          grep -q 'id="taxora-gstin-modal"' 'TAXORA GST.dc.html'
          grep -q 'id="taxora-invoice-modal"' 'TAXORA GST.dc.html'
      - name: Commit feature
        run: |
          git config user.name "Taxora Workspace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'TAXORA GST.dc.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add GSTIN and invoice checker cards [skip ci]'
          git push origin main
