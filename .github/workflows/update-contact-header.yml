name: Update Header and Contact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-contact-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply update
        run: python tools/update_contact_header.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          git commit -m "Update header and contact details [skip ci]"
          git push origin main
