name: Update Header and Contact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-contact-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update header and contact
        shell: python
        run: |
          from pathlib import Path
          p = Path('TAXORA GST.dc.html')
          s = p.read_text(encoding='utf-8')

          # Remove dead How It Works links from desktop, mobile and footer.
          how_links = [
            '<a href="#how" data-nav="#how" style="font-size:var(--fs-body-sm);font-weight:500;padding:8px 2px;border-bottom:1px solid transparent">How It Works</a>',
            '<a href="#how" onClick="{{ closeNav }}" style="min-height:44px;display:flex;align-items:center;font-size:var(--fs-body-md)">How It Works</a>',
            '<a href="#how" style="font-size:var(--fs-body-sm)">How It Works</a>'
          ]
          for x in how_links:
            s = s.replace(x, '', 1)

          # Remove Get Started buttons from desktop and mobile nav.
          desktop_get = '<a href="#contact" style="display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r-md);background:var(--primary);color:var(--on-primary);font-size:var(--fs-body-sm);font-weight:600;white-space:nowrap;border:1px solid var(--primary)" style-hover="background:var(--primary-active);border-color:var(--primary-active);color:var(--on-primary)">Get Started<span aria-hidden="true">→</span></a>'
          mobile_get = '<a href="#contact" onClick="{{ closeNav }}" style="margin-top:var(--sp-sm);min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-md);background:var(--primary);color:var(--on-primary);font-size:var(--fs-body-md);font-weight:600">Get Started<span aria-hidden="true">→</span></a>'
          s = s.replace(desktop_get, '', 1)
          s = s.replace(mobile_get, '', 1)

          # Keep nav observer aligned with remaining sections.
          s = s.replace('const ids = ["#home", "#services", "#how", "#contact"];', 'const ids = ["#home", "#services", "#contact"];', 1)

          # Add contact section before footer if not already present.
          if 'id="contact"' not in s:
            contact = '''
<section id="contact" data-screen-label="Contact" style="position:relative;z-index:1;padding:64px 24px;border-top:1px solid var(--hairline-on-dark);background:rgba(11,14,17,.72)">
  <div style="max-width:var(--container-max);margin:0 auto">
    <div class="tx-glass-card" style="border-radius:var(--r-card);padding:32px;display:grid;gap:24px;max-width:760px;margin:0 auto">
      <div style="display:grid;gap:8px;text-align:center">
        <span style="font-size:var(--fs-caption);font-weight:700;letter-spacing:.12em;color:var(--primary);text-transform:uppercase">Contact TAXORA GST</span>
        <h2 style="margin:0;color:var(--on-dark);font-size:32px;line-height:1.2">Need help with GST?</h2>
        <p style="margin:0;color:var(--muted-strong);font-size:var(--fs-body-md)">Contact us by email or WhatsApp.</p>
      </div>
      <div style="display:grid;gap:12px">
        <a href="mailto:infobridgeindia.official@gmail.com" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border:1px solid var(--hairline-on-dark);border-radius:var(--r-md);background:rgba(11,14,17,.45)">
          <span style="color:var(--muted-strong);font-size:var(--fs-body-sm)">Email</span>
          <strong style="color:var(--body);font-size:var(--fs-body-sm);word-break:break-all">infobridgeindia.official@gmail.com</strong>
        </a>
        <a href="https://wa.me/971521185821" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border:1px solid var(--hairline-on-dark);border-radius:var(--r-md);background:rgba(11,14,17,.45)">
          <span style="color:var(--muted-strong);font-size:var(--fs-body-sm)">WhatsApp</span>
          <strong style="color:var(--primary);font-size:var(--fs-body-sm)">+971 52 118 5821</strong>
        </a>
      </div>
    </div>
  </div>
</section>

'''
            marker = '<footer style="position:relative;z-index:1;padding:var(--sp-xxl) 24px var(--sp-xl);border-top:1px solid var(--hairline-on-dark);background:rgba(11,14,17,.8)">'
            if marker not in s:
              raise SystemExit('Footer marker not found')
            s = s.replace(marker, contact + marker, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify changes
        shell: python
        run: |
          from pathlib import Path
          s = Path('TAXORA GST.dc.html').read_text(encoding='utf-8')
          checks = {
            'desktop Get Started removed': 'Get Started' not in s,
            'dead How It Works link removed': '>How It Works</a>' not in s,
            'contact section exists': 'id="contact"' in s,
            'email exists': 'mailto:infobridgeindia.official@gmail.com' in s,
            'whatsapp exists': 'https://wa.me/971521185821' in s,
          }
          bad = [k for k,v in checks.items() if not v]
          if bad:
            raise SystemExit('Failed checks: ' + ', '.join(bad))

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          git commit -m "Update header and contact details [skip ci]"
          git push origin main
