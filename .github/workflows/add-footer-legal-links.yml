name: Add Footer Legal Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-footer-legal-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add legal links to compact footer
        shell: python
        run: |
          from pathlib import Path
          p = Path('TAXORA GST.dc.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<footer id="contact"')
          if start == -1:
              raise SystemExit('Compact footer not found')
          end = s.find('</footer>', start)
          if end == -1:
              raise SystemExit('Compact footer end not found')
          footer = s[start:end]
          if 'privacy.html' in footer or 'terms.html' in footer:
              raise SystemExit('Legal links already present')
          marker = '</div>\n</footer>'
          block_end = s.find(marker, start)
          if block_end == -1 or block_end > end + len('</footer>'):
              raise SystemExit('Footer inner wrapper end not found')
          legal = '''\n    <div style="grid-column:1 / -1;display:flex;justify-content:center;gap:18px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)">\n      <a href="privacy.html" style="font-size:11px;color:var(--muted)">Privacy Policy</a>\n      <a href="terms.html" style="font-size:11px;color:var(--muted)">Terms &amp; Conditions</a>\n    </div>'''
          s = s[:block_end] + legal + s[block_end:]
          p.write_text(s, encoding='utf-8')
      - name: Verify legal links
        shell: python
        run: |
          from pathlib import Path
          s = Path('TAXORA GST.dc.html').read_text(encoding='utf-8')
          for token in ['href="privacy.html"','href="terms.html"','Privacy Policy','Terms &amp; Conditions']:
              if token not in s:
                  raise SystemExit('Missing: ' + token)
      - name: Commit change
        run: |
          git config user.name "Taxora Workspace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'TAXORA GST.dc.html'
          git commit -m 'Add privacy and terms links to footer [skip ci]'
          git push origin main
