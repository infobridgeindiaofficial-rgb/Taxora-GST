name: Upgrade GST invoice preview and PDF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade invoice preview print and PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('TAXORA GST.dc.html')
          s = p.read_text(encoding='utf-8')

          # Wider invoice modal and more room for the live preview.
          a = s.index('<sc-if value="{{ invOpen }}">')
          b = s.index('<sc-if value="{{ ecbOpen }}">', a)
          seg = s[a:b]
          seg = seg.replace('width:min(1120px,100%)', 'width:min(1360px,calc(100vw - 48px))', 1)
          seg = seg.replace('grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--sp-xl);align-items:start',
                            'grid-template-columns:minmax(420px,.90fr) minmax(680px,1.35fr);gap:var(--sp-xl);align-items:start', 1)

          # Let the invoice content sit directly on the same 3D glass surface as GSTR-3B.
          seg = seg.replace('padding:var(--sp-lg);background:rgba(10,14,19,.30);border:1px solid rgba(255,255,255,.10);border-radius:var(--r-md);color:var(--on-dark);font-size:13px;line-height:1.6',
                            'padding:0;background:transparent;border:0;border-radius:0;color:var(--on-dark);font-size:12px;line-height:1.55', 1)
          seg = seg.replace('padding:8px 6px;text-align:left;border:1px solid rgba(255,255,255,.10)', 'padding:6px 5px;text-align:left;border:1px solid rgba(255,255,255,.10)')
          seg = seg.replace('padding:8px 6px;text-align:right;border:1px solid rgba(255,255,255,.10)', 'padding:6px 5px;text-align:right;border:1px solid rgba(255,255,255,.10)')
          seg = seg.replace('padding:6px;border:1px solid rgba(255,255,255,.10)', 'padding:5px;border:1px solid rgba(255,255,255,.10)')
          s = s[:a] + seg + s[b:]

          # Professional black/gold TAXORA print/PDF theme.
          s = s.replace('"@page{margin:12mm}" +', '"@page{size:A4;margin:10mm}" +', 1)
          s = s.replace('"body{font-family:Arial,Helvetica,sans-serif;color:#111;font-size:12px;margin:0}" +',
                        '"body{font-family:Arial,Helvetica,sans-serif;color:#1E2329;font-size:11px;margin:0;background:#fff}" +', 1)
          s = s.replace('".wrap{max-width:720px;margin:0 auto;padding:8px;line-height:1.5}" +',
                        '".wrap{max-width:100%;margin:0 auto;line-height:1.45;border:1px solid #D9D2BF;border-radius:10px;overflow:hidden}" +".brand{display:flex;justify-content:space-between;align-items:center;background:#11161C;color:#fff;padding:16px 18px;border-bottom:4px solid #E3B53C}"+".brandname{font-size:20px;font-weight:800;letter-spacing:1.5px;color:#E3B53C}"+".brandsub{font-size:9px;color:#C9CDD3;letter-spacing:.8px;text-transform:uppercase}"+".content{padding:16px 18px 18px}" +', 1)
          s = s.replace('"h1{text-align:center;letter-spacing:1px;margin:0 0 10px;font-size:19px;border-bottom:2px solid #333;padding-bottom:9px}" +',
                        '"h1{text-align:right;letter-spacing:1px;margin:0;font-size:18px;color:#fff}" +', 1)
          s = s.replace('"th,td{border:1px solid #bbb;padding:6px;text-align:left;vertical-align:top}" +',
                        '"th,td{border:1px solid #D9DDE3;padding:6px;text-align:left;vertical-align:top}" +', 1)
          s = s.replace('".sep{background:#f5f5f5;padding:7px 10px;border-radius:3px;margin:12px 0;font-size:12px}" +',
                        '".sep{background:#F7F4EA;border-left:3px solid #E3B53C;padding:9px 11px;border-radius:4px;margin:12px 0;font-size:11px}" +', 1)
          s = s.replace('".sum{margin:12px 0;font-size:12px}" +', '".sum{margin:12px 0;font-size:11px}" +".totalbox{display:inline-block;background:#11161C;color:#E3B53C;padding:9px 12px;border-radius:5px}" +', 1)
          s = s.replace('".foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;padding-top:10px;border-top:1px solid #ccc}" +',
                        '".foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:28px;padding-top:10px;border-top:1px solid #D9DDE3}" +', 1)
          s = s.replace('"<h1>TAX INVOICE</h1>" +',
                        '"<div class=\'brand\'><div><div class=\'brandname\'>TAXORA GST</div><div class=\'brandsub\'>GST invoice & compliance workspace</div></div><h1>TAX INVOICE</h1></div><div class=\'content\'>" +', 1)
          s = s.replace('"<th style=\'background:#333;color:#fff\'>#</th><th style=\'background:#333;color:#fff\'>Description</th><th style=\'background:#333;color:#fff\'>HSN/SAC</th>" +',
                        '"<th style=\'background:#1E2329;color:#E3B53C\'>#</th><th style=\'background:#1E2329;color:#E3B53C\'>Description</th><th style=\'background:#1E2329;color:#E3B53C\'>HSN/SAC</th>" +', 1)
          s = s.replace('background:#333;color:#fff;text-align:right', 'background:#1E2329;color:#E3B53C;text-align:right')
          s = s.replace('"<div class=\'sum\'><strong style=\'font-size:15px\'>Total: " + fmt(c.grandTotal) + "</strong><br><span class=\'words\'>"',
                        '"<div class=\'sum\'><span class=\'totalbox\'><strong style=\'font-size:15px\'>Grand Total: ₹ " + fmt(c.grandTotal) + "</strong></span><br><span class=\'words\'>"', 1)
          s = s.replace('"</div></body></html>";', '"</div></div></body></html>";', 1)

          # Make Print reliable by guarding against duplicate load calls and allowing the iframe to render.
          old_print = '''      const finish = () => {\n        try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) {}\n        setTimeout(() => { document.body.removeChild(frame); }, 1000);\n      };'''
          new_print = '''      let printed = false;\n      const finish = () => {\n        if (printed) return;\n        printed = true;\n        try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) {}\n        setTimeout(() => { if (frame.parentNode) document.body.removeChild(frame); }, 1500);\n      };'''
          if old_print not in s:
              raise SystemExit('Print finish block not found')
          s = s.replace(old_print, new_print, 1)

          # Real PDF download using html2pdf in a rendered hidden iframe; fallback to print if CDN is unavailable.
          old_pdf = '''  invDownloadPdf() {\n    this.invPrint();\n  }'''
          new_pdf = '''  invDownloadPdf() {\n    this.invTouched();\n    const err = this.invValidate();\n    if (err.bizName || err.invNumber || err.invDate || err.items || err.bizState || err.custName || err.custState || err.pos) return;\n    this.invEnsurePreview();\n    const inv = (this.state && this.state.inv) || {};\n    const filename = String(inv.invNumber || "TAXORA-GST-INVOICE").replace(/[^A-Za-z0-9._-]+/g, "-") + ".pdf";\n    const frame = document.createElement("iframe");\n    frame.style.position = "fixed"; frame.style.left = "-10000px"; frame.style.top = "0";\n    frame.style.width = "900px"; frame.style.height = "1200px"; frame.style.border = "0";\n    document.body.appendChild(frame);\n    const doc = frame.contentWindow.document;\n    let html = this.invBuildPrintHtml();\n    html = html.replace("</head>", "<script src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'><\\/script></head>");\n    doc.open(); doc.write(html); doc.close();\n    const clean = () => setTimeout(() => { if (frame.parentNode) document.body.removeChild(frame); }, 600);\n    const makePdf = () => {\n      const w = frame.contentWindow;\n      if (!w || !w.html2pdf) { clean(); this.invPrint(); return; }\n      const target = frame.contentDocument.querySelector('.wrap') || frame.contentDocument.body;\n      w.html2pdf().set({\n        margin: [6,6,6,6], filename: filename,\n        image: { type: 'jpeg', quality: 0.98 },\n        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },\n        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },\n        pagebreak: { mode: ['css','legacy'] }\n      }).from(target).save().then(clean).catch(() => { clean(); this.invPrint(); });\n    };\n    let tries = 0;\n    const wait = () => { tries += 1; if (frame.contentWindow && frame.contentWindow.html2pdf) makePdf(); else if (tries < 30) setTimeout(wait, 150); else { clean(); this.invPrint(); } };\n    setTimeout(wait, 250);\n  }'''
          if old_pdf not in s:
              raise SystemExit('PDF function not found')
          s = s.replace(old_pdf, new_pdf, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "Taxora Workspace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade GST invoice preview print and PDF [skip ci]"
            git push
          fi