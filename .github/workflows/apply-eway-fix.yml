name: Apply E-Way Bill fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix patch anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_eway.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("method_anchor = '  downloadGstPaySummary() {'", "method_anchor = '  ecb3bPatch(patch) {'")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply E-Way Bill feature
        run: python scripts/apply_eway.py
      - name: Apply compact contact layout
        run: python tools/compact_contact.py
      - name: Verify E-Way Bill feature
        run: node tests/eway-card-regression.mjs
      - name: Commit feature
        shell: bash
        run: |
          git config user.name "Taxora Workspace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'TAXORA GST.dc.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Compact contact layout [skip ci]'
          git push
