name: Apply GST interest calculator

on:
  push:
    paths:
      - '.github/workflows/apply-gst-interest-calculator.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/apply_gst_interest_calculator.py
      - name: Run regression test
        run: python tools/test_gst_interest_calculator.py
      - name: Commit change
        run: |
          if git diff --quiet -- "TAXORA GST.dc.html"; then
            echo "No HTML change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          git commit -m "Add GST Interest and Late Fee Calculator [skip ci]"
          git push
