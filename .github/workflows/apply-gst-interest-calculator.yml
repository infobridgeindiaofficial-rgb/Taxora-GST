name: Apply GST interest calculator

on:
  push:
    paths:
      - '.github/workflows/apply-gst-interest-calculator.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply calculator patch
        run: python scripts/apply_gst_interest_calculator.py
      - name: Run calculator regression test
        run: node tests/gst-interest-latefee-regression.mjs
      - name: Commit calculator
        shell: bash
        run: |
          if git diff --quiet -- "TAXORA GST.dc.html"; then
            echo "No HTML change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          git commit -m "Add GST interest and late fee calculator [skip ci]"
          git push
