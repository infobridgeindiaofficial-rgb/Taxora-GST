name: Apply GST payment card

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/apply_gst_payment_card.py
      - name: Run regression test
        run: python tools/test_gst_payment_card.py
      - name: Commit change
        shell: bash
        run: |
          git config user.name "Taxora Workspace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          if ! git diff --cached --quiet; then
            git commit -m "Add GST Payment and Challan card [skip ci]"
            git push
          fi
