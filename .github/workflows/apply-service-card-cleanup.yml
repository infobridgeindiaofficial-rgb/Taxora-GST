name: Apply service card cleanup

on:
  push:
    paths:
      - 'scripts/remove_unused_service_cards.py'
      - '.github/workflows/apply-service-card-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove unused service cards
        run: python scripts/remove_unused_service_cards.py
      - name: Run cleanup regression test
        run: node tests/service-card-cleanup-regression.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- "TAXORA GST.dc.html"; then
            echo "No HTML change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          git commit -m "Remove unused GST service cards [skip ci]"
          git push
