name: Fix E-Way Bill layout
on:
  push:
    paths:
      - '.github/workflows/fix-eway-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix E-Way Bill two-column layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('TAXORA GST.dc.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<sc-if value="{{ ewayOpen }}">')
          end = s.find('<sc-if value="{{ gstPayOpen }}">', start)
          if start < 0 or end < 0:
              raise SystemExit('E-Way Bill modal boundaries not found')
          seg = s[start:end]

          replacements = [
            ('width:min(1180px,100%)', 'width:min(1380px,calc(100vw - 32px))'),
            ('display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:var(--sp-xl);padding:var(--card-pad)',
             'display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;padding:var(--card-pad);align-items:start'),
            ('<div style="display:grid;gap:var(--sp-lg);align-content:start">',
             '<div style="display:grid;gap:var(--sp-lg);align-content:start;min-width:0">'),
            ('<div class="ecb3b-3d-wrap" style="position:sticky;top:0;align-self:start;min-width:0"><div class="ecb3b-3d" style="transform:none"><div class="ecb3b-3d-surface">',
             '<div class="ecb3b-3d-wrap" style="position:sticky;top:0;align-self:start;min-width:0;width:100%"><div class="ecb3b-3d" style="transform:none;width:100%;max-width:100%"><div class="ecb3b-3d-surface" style="width:100%;max-width:100%;box-sizing:border-box">')
          ]
          for old, new in replacements:
              if old not in seg:
                  raise SystemExit('Missing E-Way Bill layout anchor: ' + old[:100])
              seg = seg.replace(old, new, 1)

          seg = seg.replace('style="height:42px;padding:0 12px;background:var(--canvas-dark);', 'style="width:100%;min-width:0;box-sizing:border-box;height:42px;padding:0 12px;background:var(--canvas-dark);')

          s = s[:start] + seg + s[end:]
          p.write_text(s, encoding='utf-8')
          print('E-Way Bill layout fixed')
          PY
      - name: Verify E-Way Bill layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('TAXORA GST.dc.html').read_text(encoding='utf-8')
          start = s.find('<sc-if value="{{ ewayOpen }}">')
          end = s.find('<sc-if value="{{ gstPayOpen }}">', start)
          seg = s[start:end]
          assert 'grid-template-columns:minmax(0,1fr) minmax(0,1fr)' in seg
          assert 'width:min(1380px,calc(100vw - 32px))' in seg
          assert 'class="ecb3b-3d" style="transform:none;width:100%;max-width:100%"' in seg
          assert 'align-content:start;min-width:0' in seg
          assert 'width:100%;min-width:0;box-sizing:border-box;height:42px' in seg
          print('verified targeted E-Way Bill layout')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'TAXORA GST.dc.html'
          git commit -m 'Fix E-Way Bill two-column overlap [skip ci]'
          git push
