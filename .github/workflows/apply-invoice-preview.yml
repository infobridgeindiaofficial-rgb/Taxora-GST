name: Apply invoice preview layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match GST Invoice preview to GSTR-3B pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('TAXORA GST.dc.html')
          s = p.read_text(encoding='utf-8')

          inv_start = s.index('<sc-if value="{{ invOpen }}">')
          inv_end = s.index('<sc-if value="{{ ecbOpen }}">', inv_start)
          seg = s[inv_start:inv_end]

          seg = seg.replace('width:min(720px,100%)', 'width:min(1120px,100%)', 1)

          needle = '''        <div style="display:grid;gap:var(--sp-xl);padding:var(--card-pad)">\n\n          <div style="display:grid;gap:var(--sp-sm)">'''
          repl = '''        <div style="display:grid;gap:var(--sp-xl);padding:var(--card-pad)">\n          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--sp-xl);align-items:start">\n\n            <!-- LEFT PANEL — INPUTS -->\n            <div style="display:grid;gap:var(--sp-lg);align-content:start">\n\n          <div style="display:grid;gap:var(--sp-sm)">'''
          if needle not in seg:
              raise SystemExit('Invoice content wrapper not found')
          seg = seg.replace(needle, repl, 1)

          seg, n = re.subn(r'\n\s*<button type="button" onclick="\{\{ previewInv \}\}"[^>]*>\{\{ invPreviewLabel \}\}</button>', '', seg, count=1)
          if n != 1:
              raise SystemExit('Invoice preview button not found')

          pstart = seg.index('          <sc-if value="{{ inv.showPreview }}">')
          tag_re = re.compile(r'<sc-if\b[^>]*>|</sc-if>')
          depth = 0
          pend = None
          for m in tag_re.finditer(seg, pstart):
              if m.group().startswith('</'):
                  depth -= 1
              else:
                  depth += 1
              if depth == 0:
                  pend = m.end()
                  break
          if pend is None:
              raise SystemExit('Invoice preview block end not found')

          block = seg[pstart:pend]
          open_end = block.index('>') + 1
          inner = block[open_end:block.rfind('</sc-if>')]
          seg = seg[:pstart] + seg[pend:]

          old_tail = '''\n\n        </div>\n      </div>\n    </div>\n  </sc-if>'''
          idx = seg.rfind(old_tail)
          if idx == -1:
              raise SystemExit('Invoice modal tail not found')

          right = '''\n\n            </div>\n\n            <!-- RIGHT PANEL — LIVE PREVIEW (same pattern as GSTR-3B) -->\n            <div class="ecb3b-3d-wrap" style="position:sticky;top:0">\n              <div class="ecb3b-3d">\n                <div class="ecb3b-3d-surface">\n                  <div style="position:relative;display:grid;gap:var(--sp-lg);align-content:start;padding:var(--card-pad)">\n                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">\n                      <span style="font-size:var(--fs-caption);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark)">Invoice Preview</span>\n                      <span style="display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-caption);font-weight:600;color:var(--primary)"><span style="width:6px;height:6px;border-radius:50%;background:var(--primary);animation:tx-beat 2.4s ease-in-out infinite"></span>Live</span>\n                    </div>\n''' + inner + '''\n                  </div>\n                </div>\n              </div>\n            </div>\n\n          </div>'''

          seg = seg[:idx] + right + seg[idx:]
          out = s[:inv_start] + seg + s[inv_end:]

          if out.count('<sc-if') != out.count('</sc-if>'):
              raise SystemExit('sc-if tag count mismatch after patch')

          p.write_text(out, encoding='utf-8')
          PY

          git config user.name "Taxora Workspace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          if ! git diff --cached --quiet; then
            git commit -m "Match GST Invoice preview to GSTR-3B pattern [skip ci]"
            git push
          fi