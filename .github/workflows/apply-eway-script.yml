name: Apply E-Way Bill feature

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply E-Way Bill feature
        run: python scripts/apply_eway.py
      - name: Verify E-Way Bill feature
        run: node tests/eway-card-regression.mjs
      - name: Commit feature
        shell: bash
        run: |
          if git diff --quiet -- 'TAXORA GST.dc.html'; then exit 0; fi
          git config user.name "Taxora Workspace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'TAXORA GST.dc.html'
          git commit -m 'Add temporary E-Way Bill workspace [skip ci]'
          git push
