name: Fix invoice glass style

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make invoice preview match GSTR-3B glass style
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('TAXORA GST.dc.html')
          s = p.read_text(encoding='utf-8')
          a = s.index('<sc-if value="{{ invOpen }}">')
          b = s.index('<sc-if value="{{ ecbOpen }}">', a)
          seg = s[a:b]

          # Remove the old nested preview heading and old paper-style separator.
          seg = seg.replace('<span style="font-size:var(--fs-body-sm);font-weight:600;color:var(--on-dark)">Invoice Preview</span>', '', 1)
          seg = seg.replace('id="inv-preview-area" style="border-top:1px solid var(--hairline-on-dark);padding-top:var(--sp-xl)"', 'id="inv-preview-area" style="padding-top:0"', 1)

          # Turn the old white invoice paper into the same dark/glass language used by GSTR-3B.
          seg = seg.replace('padding:var(--sp-lg);background:#fff;border-radius:var(--r-md);color:#1a1a1a;font-size:13px;line-height:1.6',
                            'padding:var(--sp-lg);background:rgba(10,14,19,.30);border:1px solid rgba(255,255,255,.10);border-radius:var(--r-md);color:var(--on-dark);font-size:13px;line-height:1.6', 1)

          replacements = {
            'color:#1a1a1a':'color:var(--on-dark)',
            'color:#333':'color:var(--on-dark)',
            'color:#555':'color:var(--muted-strong)',
            'color:#777':'color:var(--muted)',
            'background:#f5f5f5':'background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10)',
            'background:#333;color:#fff':'background:rgba(255,255,255,.10);color:var(--body)',
            'border:1px solid #555':'border:1px solid rgba(255,255,255,.10)',
            'border:1px solid #ddd':'border:1px solid rgba(255,255,255,.10)',
            'border-bottom:1px solid #ddd':'border-bottom:1px solid rgba(255,255,255,.10)',
            'border-top:1px solid #ddd':'border-top:1px solid rgba(255,255,255,.10)',
            'border-top:1px solid #333':'border-top:1px solid rgba(255,255,255,.35)',
            'border-bottom:2px solid #333':'border-bottom:1px solid rgba(255,255,255,.14)'
          }
          for old, new in replacements.items():
              seg = seg.replace(old, new)

          # Match GSTR-3B accent treatment for the invoice title/total.
          seg = seg.replace('font-size:18px;font-weight:700;color:var(--on-dark)">TAX INVOICE',
                            'font-size:18px;font-weight:700;color:var(--primary)">TAX INVOICE', 1)
          seg = seg.replace('font-size:16px;font-weight:700;color:var(--on-dark)">Total:',
                            'font-size:16px;font-weight:700;color:var(--primary)">Total:', 1)

          out = s[:a] + seg + s[b:]
          p.write_text(out, encoding='utf-8')
          PY

          git config user.name "Taxora Workspace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          if ! git diff --cached --quiet; then
            git commit -m "Make GST Invoice preview match GSTR-3B glass style [skip ci]"
            git push
          fi