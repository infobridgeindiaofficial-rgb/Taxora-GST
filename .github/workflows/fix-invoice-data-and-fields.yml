name: Fix invoice data and details

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invoice preview data and add payment details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('TAXORA GST.dc.html')
          s = p.read_text(encoding='utf-8')
          a = s.index('<sc-if value="{{ invOpen }}">')
          b = s.index('<sc-if value="{{ ecbOpen }}">', a)
          seg = s[a:b]

          # 1) Fix preview row binding so live item values actually render.
          seg = seg.replace('<sc-for list="{{ inv.items }}" as="pi" index="piIdx">', '<sc-for list="{{ inv.items }}" as="item">', 1)
          seg = seg.replace('{{ pi.', '{{ item.')

          # 2) Remove duplicate left-side Tax Summary block.
          marker = '>Tax Summary</span>'
          mi = seg.find(marker)
          if mi != -1:
              start = seg.rfind('<div style="display:grid;gap:var(--sp-sm)">', 0, mi)
              if start != -1:
                  tag_re = re.compile(r'<div\b[^>]*>|</div>')
                  depth = 0
                  end = None
                  for m in tag_re.finditer(seg, start):
                      if m.group().startswith('</'):
                          depth -= 1
                      else:
                          depth += 1
                      if depth == 0:
                          end = m.end()
                          break
                  if end:
                      # remove divider immediately before it too
                      d = '<div style="border-top:1px solid var(--hairline-on-dark);padding-top:var(--sp-xl)"></div>'
                      ds = seg.rfind(d, 0, start)
                      if ds != -1 and start - (ds + len(d)) < 20:
                          start = ds
                      seg = seg[:start] + seg[end:]

          # 3) Add InfoBridge-style payment/other details section in TAXORA styling.
          if 'Payment & Other Details' not in seg:
              action_anchor = '<div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:var(--sp-sm)">'
              ai = seg.find(action_anchor)
              if ai == -1:
                  raise SystemExit('Invoice action buttons anchor not found')
              block = '''
          <div style="border-top:1px solid var(--hairline-on-dark);padding-top:var(--sp-xl)"></div>

          <div style="display:grid;gap:var(--sp-sm)">
            <span style="font-size:var(--fs-body-sm);font-weight:600;color:var(--on-dark)">Payment &amp; Other Details</span>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
              <div style="display:grid;gap:4px">
                <label style="font-size:var(--fs-caption);color:var(--muted-strong)">Bank Name</label>
                <input type="text" value="{{ inv.bankName }}" oninput="{{ setInvBankName }}" placeholder="Bank name" style="width:100%;height:40px;padding:0 12px;background:var(--canvas-dark);border:1px solid var(--hairline-on-dark);border-radius:var(--r-md);color:var(--body);font-family:inherit;font-size:var(--fs-body-sm);color-scheme:dark">
              </div>
              <div style="display:grid;gap:4px">
                <label style="font-size:var(--fs-caption);color:var(--muted-strong)">Account Number</label>
                <input type="text" value="{{ inv.accountNumber }}" oninput="{{ setInvAccountNumber }}" placeholder="Account number" style="width:100%;height:40px;padding:0 12px;background:var(--canvas-dark);border:1px solid var(--hairline-on-dark);border-radius:var(--r-md);color:var(--body);font-family:inherit;font-size:var(--fs-body-sm);color-scheme:dark">
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
              <div style="display:grid;gap:4px">
                <label style="font-size:var(--fs-caption);color:var(--muted-strong)">IFSC Code</label>
                <input type="text" value="{{ inv.ifsc }}" oninput="{{ setInvIfsc }}" placeholder="IFSC code" style="width:100%;height:40px;padding:0 12px;background:var(--canvas-dark);border:1px solid var(--hairline-on-dark);border-radius:var(--r-md);color:var(--body);font-family:inherit;font-size:var(--fs-body-sm);color-scheme:dark;text-transform:uppercase">
              </div>
              <div style="display:grid;gap:4px">
                <label style="font-size:var(--fs-caption);color:var(--muted-strong)">Authorized Signatory</label>
                <input type="text" value="{{ inv.signatory }}" oninput="{{ setInvSignatory }}" placeholder="Owner / Authorized Person" style="width:100%;height:40px;padding:0 12px;background:var(--canvas-dark);border:1px solid var(--hairline-on-dark);border-radius:var(--r-md);color:var(--body);font-family:inherit;font-size:var(--fs-body-sm);color-scheme:dark">
              </div>
            </div>
            <div style="display:grid;gap:4px">
              <label style="font-size:var(--fs-caption);color:var(--muted-strong)">Terms &amp; Conditions</label>
              <textarea oninput="{{ setInvTerms }}" placeholder="1. Payment is due within 15 days.&#10;2. Goods once sold will not be taken back." style="width:100%;min-height:82px;padding:10px 12px;background:var(--canvas-dark);border:1px solid var(--hairline-on-dark);border-radius:var(--r-md);color:var(--body);font-family:inherit;font-size:var(--fs-body-sm);resize:vertical">{{ inv.terms }}</textarea>
            </div>
            <div style="display:grid;gap:4px">
              <label style="font-size:var(--fs-caption);color:var(--muted-strong)">Additional Notes</label>
              <textarea oninput="{{ setInvAdditionalNotes }}" placeholder="Thank you for your business..." style="width:100%;min-height:72px;padding:10px 12px;background:var(--canvas-dark);border:1px solid var(--hairline-on-dark);border-radius:var(--r-md);color:var(--body);font-family:inherit;font-size:var(--fs-body-sm);resize:vertical">{{ inv.additionalNotes }}</textarea>
            </div>
          </div>

'''
              seg = seg[:ai] + block + seg[ai:]

          # 4) Add payment details into live preview before the signature footer.
          if 'PAYMENT & OTHER DETAILS' not in seg:
              foot_marker = 'Terms: Subject to local jurisdiction'
              fi = seg.find(foot_marker)
              if fi != -1:
                  fs = seg.rfind('<div style="display:flex;justify-content:space-between', 0, fi)
                  if fs != -1:
                      preview = '''
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;padding:14px;border:1px solid rgba(255,255,255,.10);border-radius:var(--r-md);background:rgba(255,255,255,.035)">
                    <div>
                      <div style="font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--primary);margin-bottom:8px">PAYMENT &amp; OTHER DETAILS</div>
                      <div style="font-size:11px;color:var(--muted-strong)">Bank Name: <span style="color:var(--body)">{{ inv.bankName }}</span></div>
                      <div style="font-size:11px;color:var(--muted-strong)">Account No: <span style="color:var(--body)">{{ inv.accountNumber }}</span></div>
                      <div style="font-size:11px;color:var(--muted-strong)">IFSC: <span style="color:var(--body)">{{ inv.ifsc }}</span></div>
                    </div>
                    <div>
                      <div style="font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--primary);margin-bottom:8px">TERMS / NOTES</div>
                      <div style="font-size:11px;color:var(--muted-strong);white-space:pre-line">{{ inv.terms }}</div>
                      <div style="font-size:11px;color:var(--muted-strong);white-space:pre-line;margin-top:6px">{{ inv.additionalNotes }}</div>
                    </div>
                  </div>
'''
                      seg = seg[:fs] + preview + seg[fs:]

          seg = seg.replace('>Authorized Signatory</div>', '>{{ inv.signatory }}</div>', 1)

          s = s[:a] + seg + s[b:]

          # 5) Wire new fields to state.
          anchor = '      setInvNotes: (e) => this.invHandleNotes(e),\n'
          if 'setInvBankName:' not in s:
              extra = anchor + '''      setInvBankName: (e) => this.invPatch({ bankName: e.currentTarget.value }),
      setInvAccountNumber: (e) => this.invPatch({ accountNumber: e.currentTarget.value }),
      setInvIfsc: (e) => this.invPatch({ ifsc: e.currentTarget.value.toUpperCase() }),
      setInvSignatory: (e) => this.invPatch({ signatory: e.currentTarget.value }),
      setInvTerms: (e) => this.invPatch({ terms: e.currentTarget.value }),
      setInvAdditionalNotes: (e) => this.invPatch({ additionalNotes: e.currentTarget.value }),
'''
              if anchor not in s:
                  raise SystemExit('view model handler anchor not found')
              s = s.replace(anchor, extra, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "Taxora Workspace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "TAXORA GST.dc.html"
          if ! git diff --cached --quiet; then
            git commit -m "Fix invoice live items and add payment details [skip ci]"
            git push
          fi