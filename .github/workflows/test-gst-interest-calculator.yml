name: Test GST interest calculator
on:
  push:
    paths:
      - 'tests/gst-interest-latefee-regression.mjs'
      - 'TAXORA GST.dc.html'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/gst-interest-latefee-regression.mjs
